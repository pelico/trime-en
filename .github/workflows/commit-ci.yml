name: Commit
on:
  push:
  workflow_dispatch:

env:
  CI_NAME: Commit CI

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-26.04
    env:
      # Only real phone ABIs are built: armeabi-v7a (旧机型) + arm64-v8a (主流机型)。
      # 去掉 x86 / x86_64（仅模拟器使用），可显著缩短原生库编译时间。
      BUILD_ABI: armeabi-v7a,arm64-v8a
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Get branch name
        id: vars
        shell: bash
        run: |
          echo ${GITHUB_REF#refs/*/}
          echo CI_BRANCH=${GITHUB_REF#refs/*/} >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 25
          # will restore cache of dependencies and wrappers
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        run: |
          sdkmanager --install "cmake;3.31.6"

      - name: Check code style
        run: |
          make style-lint

      - name: Calculate JNI cache hash
        id: cache-hash
        run: |
            ./gradlew :app:calculateNativeCacheHash

      - name: Fetch JNI cache
        uses: actions/cache@v6
        id: jni-cache
        with:
          path: "app/prebuilt"
          key: ${{ runner.os }}-trime-jni-debug-${{ steps.cache-hash.outputs.native-cache-hash }}

      - name: Fetch submodules
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        run: |
          git submodule update --init --recursive

      - name: Build debug Trime
        run: |
          make debug

      - name: Add JNI cache
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        run: cp -R app/build/intermediates/merged_native_libs/debug/mergeDebugNativeLibs/out/lib app/prebuilt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: trime-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          # keep 90 days
          retention-days: 90

      - name: Publish APK to latest release
        if: github.ref == 'refs/heads/develop'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-latest
          name: "Android Debug APK (latest)"
          prerelease: true
          body: |
            Automatic Android debug APK build from the `develop` branch.

            - 预置方案：🍀️四叶草九宫格 (`clover_jiugong`)
            - 候选词英文翻译显示（可在 设置 → 候选窗口 中开关）
          files: app/build/outputs/apk/debug/*.apk
