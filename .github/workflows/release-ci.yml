name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
env:
  CI_NAME: Release CI
# Creating the GitHub Release and uploading the APK needs contents:write;
# the repo default GITHUB_TOKEN is read-only ("Resource not accessible by
# integration" without this).
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 25
          # will restore cache of dependencies and wrappers
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        run: |
          sdkmanager --install "cmake;3.31.6"

      - name: Calculate JNI cache hash
        id: cache-hash
        run: |
            ./gradlew :app:calculateNativeCacheHash

      - name: Fetch JNI cache
        uses: actions/cache@v6
        id: jni-cache
        with:
          path: "app/prebuilt"
          key: ${{ runner.os }}-trime-jni-release-${{ steps.cache-hash.outputs.native-cache-hash }}

      - name: Setup Keystore
        run: |
          cat << EOF > keystore.properties
          keyBase64=${{ secrets.SIGNING_KEY }}
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build Trime
        run: make release

      - name: Add JNI cache
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        run: cp -R app/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib app/prebuilt

      # Generate the changelog with git and write it straight to a file.
      # Do NOT route a changelog of this size through ${{ }} outputs, CLI args
      # or env vars: a single expanded string over 128KiB trips
      # MAX_ARG_STRLEN ("Argument list too long") when the runner execs the
      # step process. Shell redirection has no such limit, and tail caps the
      # body to the last 200 commits so the release page stays readable.
      - name: Build changelog
        run: |
          TO_TAG="${GITHUB_REF_NAME}"
          FROM_TAG="$(git describe --tags --abbrev=0 "${TO_TAG}^" 2>/dev/null || true)"
          {
            if [ -n "$FROM_TAG" ]; then
              echo "Change log from $FROM_TAG to $TO_TAG:"
              git log --pretty=format:"- [%h] - %s" "$FROM_TAG..$TO_TAG" || true
            else
              echo "Change log for $TO_TAG:"
              git log --pretty=format:"- [%h] - %s" "$TO_TAG" || true
            fi
            echo ""
          } | tail -n 201 > "${{ github.workspace }}/release-body.md"

      - name: Create Stable release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          body_path: ${{ github.workspace }}/release-body.md
          working_directory: "app/build/outputs/apk/release/"
          files: |
            *.apk
