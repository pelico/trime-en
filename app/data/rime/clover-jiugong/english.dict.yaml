# Rime dictionary
# encoding: utf-8
#
# 常见英文混输词库（本项目自建，原创整理）
#
# 用途：作为 clover_jiugong（九宫格）方案的英文次翻译器词库。
# 词条的 code 即英文单词本身，经方案 speller/algebra 统一映射为九宫格数字码，
# 因此输入与中文相同的数字键位即可命中，例如 AI 的码为 ai -> 24，
# 在九宫格上按「2 4」即可候选出 AI。
#
# 可按需自由增删词条：格式为「词条 <TAB> 码 <TAB> 权重」。
