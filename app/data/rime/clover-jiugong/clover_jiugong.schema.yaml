# Rime schema
# encoding: utf-8
#
# 四叶草九宫格（clover_jiugong）
#
# 取自 SivanLaai/rime-pure（MIT License）的「Clover四叶草九宫拼音」方案，
# 作为同文输入法的预置九宫格输入方案。为适配本项目的预置数据环境，
# 移除了对未内置的 `emoji` 依赖方案与相关 OpenCC 额外过滤器的引用，
# 并去掉 `dependencies: [stroke]`：`stroke` 方案自身依赖 `luna_pinyin`（本项目
# 不再内置），而这里仅通过 `reverse_lookup.dictionary: stroke` 使用笔画词库反查，
# 无需构建整套 stroke 方案。其余拼写代数、词库、简繁切换等均保持原样。
#
# 说明：主题 `.trime.yaml` 中提供了同名的 `clover_jiugong` 九宫格键盘，
# Trime 会依据 schema_id 自动匹配该键盘布局。
#
# 联想（下一词预测）：由编译进本项目的 librime-predict 插件提供，
# 预测数据为同目录下的 `predict.db`。该数据取自第三方仓库
# klchen0112/rime-combo-ice-pinyin 的 wanxiang-lts-zh-predict.db
# （疑似源自「万象拼音」amzxyz/rime-wanxiang，CC-BY-4.0），原仓库未声明许可证，
# 使用与再分发前请自行评估，详见仓库根目录 ATTRIBUTION.md。

schema:
  schema_id: clover_jiugong
  name: 🍀️四叶草九宫格
  version: "0.19"
  # 声明英文次翻译器依赖：librime 部署时才会编译 english.dict.yaml，
  # 生成 table_translator@english 运行所需的 english.table.bin / english.prism.bin。
  dependencies:
    - english
  author:
    - SivanLaai - https://sivanlaai.github.io
  description: |
    🍀️四叶草九宫格：
    以🍀️四叶草简体拼音为基础所配置的一款适合在手机九宫格上输入的输入方案。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中, 英 ]
  - name: full_shape
    states: [ 半, 全 ]
  - name: zh_simp_s2t
    states: [ 简, 繁 ]
    reset: 0
  - name: ascii_punct
    states: [ 。，, ．， ]
  - name: prediction
    states: [ 预测关, 预测开 ]
    reset: 1

engine:
  processors:
    - ascii_composer
    - recognizer
    - predictor
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - predict_translator
    - punct_translator
    - table_translator@custom_phrase
    - table_translator@english
    - reverse_lookup_translator
    - script_translator
  filters:
    - simplifier
    - uniquifier

# 联想（librime-predict）配置：db 为共享目录下的预测词库，
# max_candidates 限制每次预测候选数，max_iterations 限制连续预测次数。
predictor:
  db: predict.db
  max_candidates: 5
  max_iterations: 1

speller:
  alphabet: 'zyxwvutsrqponmlkjihgfedcba1234567890'
  delimiter: " '"
  algebra:
    - "xlit|12345|+_*^0|"
    - erase/^xx$/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/([aeiou])ng$/$1gn/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - derive/ao$/oa/
    - derive/([iu])a(o|ng?)$/a$1$2/
    # 模糊音（默认开启）。规则取自 rime-ice 的常见模糊音，须置于下方数字映射之前。
    # 声母：zh/ch/sh 与 z/c/s 互模糊
    - derive/^([zcs])h/$1/
    - derive/^([zcs])([^h])/$1h$2/
    # 声母：n 与 l 互模糊
    - derive/^n/l/
    - derive/^l/n/
    # 韵母：前后鼻音互模糊（an↔ang、en↔eng、in↔ing）
    - derive/ang$/an/
    - derive/an$/ang/
    - derive/eng$/en/
    - derive/en$/eng/
    - derive/ing$/in/
    - derive/in$/ing/
    - xlit/abcdefghijklmnopqrstuvwxyz/22233344455566677778889999/
    - derive/[+_*^0]//
    - derive/([+_*^0])$//
    - derive/^(.*)$/\U$1/

translator:
  dictionary: clover
  prism: clover_jiugong
  spelling_hints: 0 # 关闭候选词的拼音标注（九宫格下拼音冗余，避免与 App 提供的英文翻译行互相挤占）
  enable_sentence: true
  enable_user_dict: true
  enable_encoder: true
  encode_commit_history: true
  max_phrase_length: 10
  user_dict: user
  db_class: tabledb
  disable_user_dict_for_patterns:
    - "^z.*$"
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/
    - xform/eh/ê/

custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 1

# 英文混输：词库 english.dict.yaml 的词条码即英文单词本身，
# 经 speller/algebra 统一映射为九宫格数字码，故按数字键位即可候选出英文词。
english:
  dictionary: english
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  initial_quality: 1.1
  comment_format:
    - xform/.*// # 清空提示码（无需展示英文的拼音/码提示）

reverse_lookup:
  dictionary: stroke
  enable_completion: true
  prefix: "`"
  suffix: "'"
  tips: 〔笔画〕
  preedit_format:
    - "xlit|v|ü|"
    - xform/iü/iv/
    - xform/uü/uv/

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default

simplifier:
  option_name: zh_simp_s2t
  opencc_config: s2t.json

recognizer:
  import_preset: default
  patterns:
    punct: "^/([0-9]0?|[a-z]+)$"
    reverse_lookup: "`[a-z]*'?$"
